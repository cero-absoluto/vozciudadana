# CANDIDATO — INERTE. No está en .github/workflows/, así que no se ejecuta. Instalarlo requiere autorización expresa del Owner; ver ../PLAN.md.
# Fase B, emisor: publica UNA petición `@codex review` como github-actions[bot] sobre la PR sintética indicada, con el GITHUB_TOKEN automático.
# Sin token ni modelo de Claude, sin inferencia, sin checkout de la PR (se lee `main`), sin contents:write. `issues: write` SOLO en el job `send`.
name: phase-b-send
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número de la PR sintética (rama phaseb/*, un único fichero automation/phaseb-synthetic/probe.txt)
        required: true
        type: string
      expected_head_sha:
        description: SHA completo (40 hex) de la cabeza de esa PR
        required: true
        type: string
permissions: {}
concurrency:
  group: phase-b-send
  cancel-in-progress: false
jobs:
  precheck:
    if: github.ref == 'refs/heads/main' && github.repository == 'cero-absoluto/vozciudadana'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node automation/phaseb/phaseb.mjs plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phaseb-plan
          path: phaseb-out
          retention-days: 7
  send:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node automation/phaseb/phaseb.mjs send
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phaseb-send
          path: phaseb-out
          retention-days: 7
