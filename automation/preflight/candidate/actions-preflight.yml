# CANDIDATO — INERTE. No está en .github/workflows/, así que no se ejecuta. Instalarlo (copiarlo a
# .github/workflows/actions-preflight.yml) requiere autorización expresa del Owner; ver ../PLAN.md.
#
# Preflight A (manual, SIN token ni modelo de Claude, SIN revisión de Codex, SIN inferencia, SIN escrituras):
# comprueba en un runner real versiones, checkout, permisos efectivos de solo lectura del GITHUB_TOKEN, identidades de bot
# con la API y con eventos ya publicados, fijación de acciones por SHA, CLI de Claude (solo --version/--help),
# integridad del parche entre jobs, salida del controlador, puertas `if:` e interruptor `vars` por job.
# Ningún paso imprime variables de entorno ni secretos. Cada comprobación termina en PASS | FAIL | NO_PROBADO.
name: actions-preflight
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR (número) cuyos eventos reales del auditor se LEEN. Solo lectura.'
        required: true
        default: '38'
      switch_wait_seconds:
        description: 'Espera (0-300 s) en el job switch-1 para que el Owner cambie vars.AGENT_HANDOFF_ENABLED a mano. 0 = no se intenta.'
        required: false
        default: '0'

concurrency:
  group: actions-preflight
  cancel-in-progress: false

permissions: {}

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      action: ${{ steps.controller.outputs.action }}
    env:
      REPORT_DIR: ${{ github.workspace }}/preflight-report
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: context
        run: node automation/preflight/preflight.mjs context
      - if: always()
        run: node automation/preflight/preflight.mjs permissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: always()
        run: node automation/preflight/preflight.mjs identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Única instalación: la herramienta aislada del preflight (solo `yaml`, versión exacta, lockfile propio, sin scripts). Sin credenciales; permisos de solo lectura.
      - id: tools
        if: always()
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix automation/preflight/tools
      - if: always()
        run: node automation/preflight/preflight.mjs pins
      - if: always()
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: anthropics/claude-code-action
          ref: 6c690188da61cf16ee7debb28383ba67f02abb4c   # v1.0.242: el SHA que usaría el piloto (ver pins.json)
          path: action-src
          persist-credentials: false
          fetch-depth: 1
      - if: always()
        run: node automation/preflight/preflight.mjs cli
        env:
          ACTION_DIR: ${{ github.workspace }}/action-src
          INSTALL_DIR: ${{ runner.temp }}/cli
      # Credencial FICTICIA e inequívoca: solo declarada en este paso. No certifica nada del modelo autenticado.
      - if: always()
        run: node automation/preflight/preflight.mjs env-a
        env:
          CLAUDE_CODE_OAUTH_TOKEN: FICTICIO-NO-ES-UN-TOKEN-preflight
      - if: always()
        run: node automation/preflight/preflight.mjs env-b
      - id: controller
        if: always()
        run: node automation/preflight/preflight.mjs controller
        env:
          AGENT_HANDOFF_ENABLED: ${{ vars.AGENT_HANDOFF_ENABLED }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-runner
          path: ${{ github.workspace }}/preflight-report
          retention-days: 3

  # Integridad del parche entre jobs (fixture inofensivo; nada se aplica ni se empuja).
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.make.outputs.sha256 }}
      artifact_digest: ${{ steps.up.outputs.artifact-digest }}
    env:
      REPORT_DIR: ${{ github.workspace }}/preflight-report
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: make
        run: node automation/preflight/preflight.mjs integrity-produce
        env:
          OUT_DIR: ${{ runner.temp }}/out
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-patch
          path: ${{ runner.temp }}/out/handoff.patch
          retention-days: 1
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-produce
          path: ${{ github.workspace }}/preflight-report
          retention-days: 3

  consume:
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REPORT_DIR: ${{ github.workspace }}/preflight-report
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixture-patch
          path: ${{ runner.temp }}/in
      - run: node automation/preflight/preflight.mjs integrity-consume
        env:
          IN_DIR: ${{ runner.temp }}/in
          EXPECTED_SHA256: ${{ needs.produce.outputs.sha256 }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-consume
          path: ${{ github.workspace }}/preflight-report
          retention-days: 3

  # Puertas `if:` que leen la salida del controlador (la salida de `runner` es `run_claude`).
  gate-run:
    needs: runner
    if: needs.runner.outputs.action == 'run_claude'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "gate-run ejecutado"
  gate-skip:
    needs: runner
    if: needs.runner.outputs.action == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "gate-skip NO debería ejecutarse"

  # `vars` por job: switch-1 lo registra y espera; switch-2 arranca después. Si el Owner lo cambia durante la espera y los
  # valores difieren, `vars` se resuelve por job. Sin cambio, NO_PROBADO.
  switch-1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      value: ${{ steps.rec.outputs.value }}
    env:
      REPORT_DIR: ${{ github.workspace }}/preflight-report
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: rec
        run: node automation/preflight/preflight.mjs switch 1
        env:
          SWITCH_VALUE: ${{ vars.AGENT_HANDOFF_ENABLED }}
      - run: node automation/preflight/preflight.mjs wait
        env:
          WAIT: ${{ inputs.switch_wait_seconds }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-switch-1
          path: ${{ github.workspace }}/preflight-report
          retention-days: 3
  switch-2:
    needs: switch-1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      value: ${{ steps.rec.outputs.value }}
    env:
      REPORT_DIR: ${{ github.workspace }}/preflight-report
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: rec
        run: node automation/preflight/preflight.mjs switch 2
        env:
          SWITCH_VALUE: ${{ vars.AGENT_HANDOFF_ENABLED }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-switch-2
          path: ${{ github.workspace }}/preflight-report
          retention-days: 3

  summary:
    needs: [runner, produce, consume, gate-run, gate-skip, switch-1, switch-2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      REPORT_DIR: ${{ github.workspace }}/preflight-all
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ github.workspace }}/preflight-all
      - run: node automation/preflight/preflight.mjs summary
        env:
          RESULT_RUNNER: ${{ needs.runner.result }}
          RESULT_PRODUCE: ${{ needs.produce.result }}
          RESULT_CONSUME: ${{ needs.consume.result }}
          RESULT_GATE_RUN: ${{ needs.gate-run.result }}
          RESULT_GATE_SKIP: ${{ needs.gate-skip.result }}
          RESULT_SWITCH_1: ${{ needs.switch-1.result }}
          RESULT_SWITCH_2: ${{ needs.switch-2.result }}
          SWITCH_1: ${{ needs.switch-1.outputs.value }}
          SWITCH_2: ${{ needs.switch-2.outputs.value }}
          SWITCH_WAIT: ${{ inputs.switch_wait_seconds }}
          ARTIFACT_DIGEST: ${{ needs.produce.outputs.artifact_digest }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-report
          path: ${{ github.workspace }}/preflight-all
          retention-days: 7
